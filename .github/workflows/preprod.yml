name: Preprod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-preprod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing preprod
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          PREPROD_SSH_KEY: ${{ secrets.PREPROD_SSH_KEY }}
          PREPROD_KNOWN_HOSTS: ${{ secrets.PREPROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${PREPROD_SSH_KEY}" > "${HOME}/.ssh/preprod"
          chmod 600 "${HOME}/.ssh/preprod"
          printf '%s\n' "${PREPROD_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy
        env:
          PREPROD_HOST: ${{ secrets.PREPROD_HOST }}
          PREPROD_USER: ${{ secrets.PREPROD_USER }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/preprod" \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "${PREPROD_USER}@${PREPROD_HOST}" \
            "/opt/onir-cms-landing-preprod/deploy/preprod.sh"

      - name: Smoke test
        env:
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="https://preprod-cms.onirtech.com"
          AUTH="${PREPROD_BASIC_USER}:${PREPROD_BASIC_PASSWORD}"
          curl -fsS --retry 10 --retry-delay 3 -u "${AUTH}" "${BASE}/" | grep -q "ONIR CMS"
          curl -fsS --retry 10 --retry-delay 3 -u "${AUTH}" -o /dev/null "${BASE}/plugins/"
          curl -fsS "${BASE}/api/health" | grep -q '"ok":true'
          echo "Landing preprod smoke test OK."
