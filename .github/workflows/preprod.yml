name: Preprod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-preprod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing preprod
    runs-on: [self-hosted, onir-landing-preprod]
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          /opt/onir-cms-landing-preprod/deploy/preprod.sh

      - name: Smoke test
        env:
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="https://preprod-cms.onirtech.com"
          AUTH="${PREPROD_BASIC_USER}:${PREPROD_BASIC_PASSWORD}"
          curl -fsS --retry 10 --retry-delay 3 -u "${AUTH}" "${BASE}/" | grep -q "ONIR CMS"
          curl -fsS --retry 10 --retry-delay 3 -u "${AUTH}" -o /dev/null "${BASE}/plugins/"
          curl -fsS "${BASE}/api/health" | grep -q '"ok":true'
          echo "Landing preprod smoke test OK."
