# À inclure dans le server TLS de cms.onirtech.com.
# Le site public est statique ; l’application est servie par cms-backoffice.onirtech.com.

root /var/www/onir-cms-landing;
index index.html;

# Anciennes URL publiques de l’application → nouveau domaine.
location = /l {
  return 301 https://cms-backoffice.onirtech.com$request_uri;
}

location ^~ /l/ {
  return 301 https://cms-backoffice.onirtech.com$request_uri;
}

location ~ ^/(login|dashboard|api|documentation|change-password|invitation|no-organization|confidentialite)(/|$) {
  return 301 https://cms-backoffice.onirtech.com$request_uri;
}

# Anciens téléchargements servis sous /plugins/ → nouveaux assets statiques.
location ~ ^/plugins/([^/]+\.(onirtech-template|release\.json))$ {
  return 301 /assets/plugins/$1;
}

# Fichiers statiques : cache long pour les assets versionnés par le contenu.
location /assets/ {
  try_files $uri =404;
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
}

location / {
  try_files $uri $uri/ $uri.html =404;
}

error_page 404 /404.html;
location = /404.html {
  internal;
}

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
