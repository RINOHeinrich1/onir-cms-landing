# cms.onirtech.com — site public statique ONIR CMS.
# L’application est servie par cms-backoffice.onirtech.com.

server {
    server_name cms.onirtech.com;

    access_log /var/log/nginx/cms.onirtech.com.access.log;
    error_log  /var/log/nginx/cms.onirtech.com.error.log;

    root /var/www/onir-cms-landing;
    index index.html;

    # Anciennes URL publiques de l’application → nouveau domaine.
    location = /l {
        return 301 https://cms-backoffice.onirtech.com$request_uri;
    }

    location ^~ /l/ {
        return 301 https://cms-backoffice.onirtech.com$request_uri;
    }

    location ~ ^/(login|dashboard|api|documentation|change-password|invitation|no-organization|confidentialite)(/|$) {
        return 301 https://cms-backoffice.onirtech.com$request_uri;
    }

    # Anciens téléchargements servis sous /plugins/ → nouveaux assets statiques.
    location ~ ^/plugins/([^/]+\.(onirtech-template|release\.json))$ {
        return 301 /assets/plugins/$1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cms.onirtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.onirtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.onirtech.com;
    return 301 https://$host$request_uri;
}
