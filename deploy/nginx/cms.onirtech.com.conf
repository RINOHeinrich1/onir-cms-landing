# cms.onirtech.com — ancien domaine public, redirigé vers onir-cms.tech.
# L’application est servie par cms-backoffice.onirtech.com.

server {
    listen 80;
    listen [::]:80;
    server_name cms.onirtech.com;
    return 301 https://onir-cms.tech$request_uri;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name cms.onirtech.com;

    access_log /var/log/nginx/cms.onirtech.com.access.log;
    error_log  /var/log/nginx/cms.onirtech.com.error.log;

    ssl_certificate /etc/letsencrypt/live/cms.onirtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.onirtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Téléversement temporaire de références visuelles (privé) — conservé.
    location ^~ /refs-d95b5a29d664/ {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # Tout le reste → nouveau domaine.
    location / {
        return 301 https://onir-cms.tech$request_uri;
    }
}
