# onir-cms.tech + www.onir-cms.tech — site public statique ONIR CMS.
# L’application est servie par cms-backoffice.onirtech.com.

server {
    listen 80;
    listen [::]:80;
    server_name onir-cms.tech www.onir-cms.tech;

    # Renouvellement Let’s Encrypt (webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;

    server_name onir-cms.tech www.onir-cms.tech;

    access_log /var/log/nginx/onir-cms.tech.access.log;
    error_log  /var/log/nginx/onir-cms.tech.error.log;

    root /var/www/onir-cms-landing;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/onir-cms.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onir-cms.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Anciennes URL publiques de l’application → domaine back-office.
    location = /l {
        return 301 https://cms-backoffice.onirtech.com$request_uri;
    }

    location ^~ /l/ {
        return 301 https://cms-backoffice.onirtech.com$request_uri;
    }

    location ~ ^/(login|dashboard|api|documentation|change-password|invitation|no-organization|confidentialite)(/|$) {
        return 301 https://cms-backoffice.onirtech.com$request_uri;
    }

    # Anciens téléchargements servis sous /plugins/ → nouveaux assets statiques.
    location ~ ^/plugins/([^/]+\.(onirtech-template|release\.json))$ {
        return 301 /assets/plugins/$1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
