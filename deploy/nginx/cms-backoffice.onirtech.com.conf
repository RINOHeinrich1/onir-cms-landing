# cms-backoffice.onirtech.com — application ONIR CMS (Next.js sur 127.0.0.1:3100).

server {
    listen 80;
    listen [::]:80;
    server_name cms-backoffice.onirtech.com;
    return 301 https://$host$request_uri;
}

server {
    server_name cms-backoffice.onirtech.com;

    access_log /var/log/nginx/cms-backoffice.onirtech.com.access.log;
    error_log  /var/log/nginx/cms-backoffice.onirtech.com.error.log;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cms-backoffice.onirtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms-backoffice.onirtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
